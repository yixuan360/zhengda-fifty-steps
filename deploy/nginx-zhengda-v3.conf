# 郑大五十步 V3 staging — 复用 80 端口的路径隔离
#
# 安装方式：
#   cp deploy/nginx-zhengda-v3.conf /etc/nginx/snippets/zhengda-v3.conf
#   在主 server { } 内加一行：
#   include /etc/nginx/snippets/zhengda-v3.conf;
#
# 只匹配 V3 新增路径，旧的 /api/v1/、/media/、/manage/ 不受影响。

# V3 Django：/api/v2/narrative/... -> 127.0.0.1:8001
location /api/v2/narrative/ {
    limit_req zone=api_limit burst=10 nodelay;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store";
}

# V3 Agent：/agent/narrative/route -> 127.0.0.1:8101/narrative/route
location /agent/ {
    proxy_pass http://127.0.0.1:8101/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
}

# V3 路线/深度稿音频：/media/audio/narrative/... -> staging media
# 必须比 /media/ 更长，nginx 会自动优先匹配这一条。
location /media/audio/narrative/ {
    alias /opt/zhengda-v3/server/media/audio/narrative/;
    expires 30d;
    add_header Accept-Ranges bytes;
    add_header Cache-Control "public";
}

# V1 Agent 合成音频（V3 Agent 的 /narrative-media/）
location /narrative-media/ {
    alias /opt/zhengda-v3/agent_service/media_cache/;
    expires 30d;
    add_header Cache-Control "public";
}
