# 郑大五十步 — Nginx 配置
# 部署路径：/etc/nginx/sites-available/zhengda.conf
# 启用方式：ln -s /etc/nginx/sites-available/zhengda.conf /etc/nginx/sites-enabled/

# 限流：每个 IP 每秒最多 10 次 API 请求
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name 123.57.94.91;

    # 客户端上传最大 50MB（音频文件）
    client_max_body_size 50M;

    # ─── 静态文件（Django Admin CSS/JS） ─────────────────
    location /static/ {
        alias /opt/zhengda-fifty-steps/server/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── 媒体文件（图片 + 音频） ──────────────────────────
    location /media/ {
        alias /opt/zhengda-fifty-steps/server/media/;
        expires 30d;
        # 音频支持断点续传（拖动进度条）
        add_header Accept-Ranges bytes;
    }

    # ─── 文脉叙事引擎新增（T5）─────────────────────────────
    # Agent 服务：/agent/narrative/next -> 127.0.0.1:8100/narrative/next
    # proxy_pass 末尾的 / 会剥掉 /agent/ 前缀
    location /agent/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM + TTS 可能较慢，放宽读超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Agent 合成音频缓存（edge-tts 输出）
    location /narrative-media/ {
        alias /opt/zhengda-fifty-steps/agent_service/media_cache/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── API 接口 ─────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API 请求不缓存
        add_header Cache-Control "no-store";
    }

    # ─── Django Admin 管理后台 ────────────────────────────
    location /manage/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
